[package]
name = "minigames-kit-crowd-threading"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone demo of the CrowdThreading minigame from minigames-kit"
publish = false

[dependencies]
retro-kit = { workspace = true }
minigames-kit = { workspace = true, features = ["crowd_threading"] }

dioxus = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
