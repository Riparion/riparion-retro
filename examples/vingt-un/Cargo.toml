[package]
name = "minigames-kit-vingt-un"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone demo of the Vingt-et-Un minigame from minigames-kit"
publish = false

[dependencies]
retro-kit = { workspace = true }
minigames-kit = { workspace = true, features = ["vingt_un"] }

dioxus = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
