[package]
name = "minigames-kit-heave"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone demo of the Heave minigame from minigames-kit"
publish = false

[dependencies]
retro-kit = { workspace = true }
minigames-kit = { workspace = true, features = ["heave"] }

dioxus = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
