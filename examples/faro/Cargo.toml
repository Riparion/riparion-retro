[package]
name = "minigames-kit-faro"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone demo of the Faro minigame from minigames-kit"
publish = false

[dependencies]
retro-kit = { workspace = true }
minigames-kit = { workspace = true, features = ["faro"] }

dioxus = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
