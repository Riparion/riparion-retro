[package]
name = "kaintuck-server"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Native (axum + WebSocket) game server hosting kaintuck's persistent shared market for humans and bots"

[dependencies]
# The same headless engine the UI runs — the server is authoritative over the
# shared market; `sim` brings in the bot policies that keep the market alive.
kaintuck-engine = { workspace = true, features = ["sim"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
kaintuck-engine = { workspace = true, features = ["sim"] }
tokio-tungstenite = "0.26"
futures = { workspace = true }
