[package]
name = "minigames-kit"
version = "0.1.9"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable, parameterized minigame components (QuickDraw, …) shared across the games in this workspace"

[features]
# Each minigame is its own feature so a host can take only what it needs.
# `default = ["all"]` keeps existing consumers working untouched; opt into a
# subset with `default-features = false, features = ["quickdraw"]`.
default = ["all"]
all = ["quickdraw", "timing_bar", "crowd_threading", "faro", "hunter", "steady_hands", "bucket_brigade", "hot_cold", "sequence", "heave", "vingt_un"]
quickdraw = []
timing_bar = []
crowd_threading = []
faro = []
hunter = []
steady_hands = []
bucket_brigade = []
hot_cold = []
sequence = []
heave = []
vingt_un = []

[dependencies]
dioxus = { workspace = true }
gloo-timers = { workspace = true }
retro-kit = { workspace = true }

# Each minigame now ships a standalone, runnable demo crate under `examples/<name>`
# at the workspace root (e.g. `dx serve --package minigames-kit-quickdraw`), so
# this crate no longer carries cargo `[[example]]` binaries.
