[package]
name = "kaintuck"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
retro-kit = { workspace = true }
# SteadyHands drives the sandbar/swamp/Falls run/Duck River fords; QuickDraw
# drives the river-pirate and Mason/Harpe ambushes; CrowdThreading drives
# getting lost on side trails; TimingBar drives the Under-the-Hill gamble and
# medicine dosing; Sequence drives the snag hull-repair; BucketBrigade drives
# bailing a flooded boat. Skip the rest.
minigames-kit = { workspace = true, features = ["quickdraw", "steady_hands", "crowd_threading", "timing_bar", "sequence", "bucket_brigade"] }

dioxus = { workspace = true }
serde = { workspace = true }
gloo-timers = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
