[package]
name = "kaintuck"
version = "0.1.24"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
retro-kit = { workspace = true }
# The headless game engine (state machine, economy, scenario interpretation).
kaintuck-engine = { workspace = true }
# The data-driven scenario (content + flow) lives in an embedded RON file that
# trail-kit parses into an immutable Scenario.
trail-kit = { workspace = true }
# SteadyHands drives the Falls run / Duck River ford (holding a line against a
# force); Heave the grounding-on-a-bar push and the Grand Chain cordelle; Hunter
# the Harpe fight and hunting for the pot; HotCold Mason's search for your hidden
# money; QuickDraw the river-pirate boarding; CrowdThreading the side-trails and
# the swamp firm-line route-find; TimingBar the Under-the-Hill gamble, medicine
# dosing, and the Cave-in-Rock pilot tell; Sequence the snag hull-repair;
# BucketBrigade bailing a flooded boat; Faro and VingtUn the Natchez card tables
# Under-the-Hill.
minigames-kit = { workspace = true, features = ["quickdraw", "steady_hands", "crowd_threading", "timing_bar", "sequence", "bucket_brigade", "heave", "hot_cold", "hunter", "faro", "vingt_un"] }

dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gloo-timers = { workspace = true }
# Optional multiplayer: WebSocket client for the shared-market game server.
gloo-net = { workspace = true, features = ["websocket"] }
futures = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
