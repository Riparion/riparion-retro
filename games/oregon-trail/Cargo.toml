[package]
name = "oregon-trail"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
retro-kit = { workspace = true }
# QuickDraw drives gunfights; Hunter drives the hunting gallery; CrowdThreading
# drives the escape from hostile riders. Skip the rest.
minigames-kit = { workspace = true, features = ["quickdraw", "hunter", "crowd_threading"] }

dioxus = { workspace = true }
serde = { workspace = true }
gloo-timers = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
