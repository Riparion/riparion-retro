[package]
name = "oregon-trail"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
retro-kit = { workspace = true }
# Only the QuickDraw minigame is used (the shooting screen); skip the rest.
minigames-kit = { workspace = true, features = ["quickdraw"] }

dioxus = { workspace = true }
serde = { workspace = true }
gloo-timers = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
