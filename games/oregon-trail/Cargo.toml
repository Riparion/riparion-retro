[package]
name = "oregon-trail"
version = "0.1.6"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
retro-kit = { workspace = true }
# QuickDraw drives gunfights; Hunter drives the hunting gallery; CrowdThreading
# drives the escape from hostile riders; TimingBar drives setting a broken bone
# and measuring out medicine; SteadyHands drives the snakebite, river ford, and
# ox-leg traces. Skip the rest.
minigames-kit = { workspace = true, features = ["quickdraw", "hunter", "crowd_threading", "timing_bar", "steady_hands", "bucket_brigade"] }

dioxus = { workspace = true }
serde = { workspace = true }
gloo-timers = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
